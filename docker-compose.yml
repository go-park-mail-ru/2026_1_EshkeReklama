services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      AUTH_GRPC_ADDR: :50051
      AUTH_PG_DSN: postgres://${POSTGRES_USER:-eshkere}:${POSTGRES_PASSWORD:-eshkere}@postgres:5432/${POSTGRES_DB:-eshkere}?sslmode=disable
      AUTH_REDIS_ADDR: redis:6379
      AUTH_REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      AUTH_VKID_CLIENT_ID: ${AUTH_VKID_CLIENT_ID:-}
      AUTH_VKID_REDIRECT_URI: ${AUTH_VKID_REDIRECT_URI:-}
      AUTH_VKID_DOMAIN: ${AUTH_VKID_DOMAIN:-id.vk.ru}
      AUTH_VKID_TIMEOUT: ${AUTH_VKID_TIMEOUT:-5s}
    ports:
      - "50051:50051"

  profile:
    build:
      context: .
      dockerfile: Dockerfile
      target: profile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      PROFILE_GRPC_ADDR: :50052
      PROFILE_REDIS_ADDR: redis:6379
      PROFILE_REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    ports:
      - "50052:50052"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: eshkere
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      auth:
        condition: service_started
      profile:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-eshkere}
      POSTGRES_USER: ${POSTGRES_USER:-eshkere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eshkere}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-eshkere-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/eshkere}
      AUTH_GRPC_ADDR: auth:50051
      PROFILE_GRPC_ADDR: profile:50052
      AUTH_VKID_CLIENT_ID: ${AUTH_VKID_CLIENT_ID:-}
      AUTH_VKID_REDIRECT_URI: ${AUTH_VKID_REDIRECT_URI:-}
      AUTH_VKID_DOMAIN: ${AUTH_VKID_DOMAIN:-id.vk.ru}
      VKID_SCOPE: ${VKID_SCOPE:-email phone}
      VKID_DEFAULT_REDIRECT_URL: ${VKID_DEFAULT_REDIRECT_URL:-http://localhost:8080/}
      VKID_ERROR_REDIRECT_URL: ${VKID_ERROR_REDIRECT_URL:-http://localhost:8080/login}
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eshkere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eshkere}
      POSTGRES_DB: ${POSTGRES_DB:-eshkere}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.1
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-eshkere}:${POSTGRES_PASSWORD:-eshkere}@postgres:5432/${POSTGRES_DB:-eshkere}?sslmode=disable
      - up

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/minio:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-eshkere}
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$S3_BUCKET &&
        mc anonymous set public local/$$S3_BUCKET
      "

volumes:
  postgres_data:
  minio_data:
