services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      AUTH_GRPC_ADDR: :50051
      AUTH_METRICS_ADDR: :9101
      AUTH_PG_DSN: postgres://${POSTGRES_USER:-eshkere}:${POSTGRES_PASSWORD:-eshkere}@postgres:5432/${POSTGRES_DB:-eshkere}?sslmode=disable
      AUTH_REDIS_ADDR: redis:6379
      AUTH_REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      AUTH_VKID_CLIENT_ID: ${AUTH_VKID_CLIENT_ID:-}
      AUTH_VKID_DOMAIN: ${AUTH_VKID_DOMAIN:-id.vk.ru}
      AUTH_VKID_TIMEOUT: ${AUTH_VKID_TIMEOUT:-5s}
    ports:
      - "50051:50051"

  profile:
    build:
      context: .
      dockerfile: Dockerfile
      target: profile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      PROFILE_GRPC_ADDR: :50052
      PROFILE_METRICS_ADDR: :9102
      PROFILE_REDIS_ADDR: redis:6379
      PROFILE_REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    ports:
      - "50052:50052"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: eshkere
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      auth:
        condition: service_started
      profile:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      APP_METRICS_ADDR: :9100
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-eshkere}
      POSTGRES_USER: ${POSTGRES_USER:-eshkere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eshkere}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-eshkere}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/eshkere}
      AUTH_GRPC_ADDR: auth:50051
      PROFILE_GRPC_ADDR: profile:50052
      KAFKA_BROKERS: kafka:9092
      KAFKA_AD_EVENTS_TOPIC: ${KAFKA_AD_EVENTS_TOPIC:-ad-events}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-analytics-consumer}
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-eshkere}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL}
      YOOKASSA_WEBHOOK_URL: ${YOOKASSA_WEBHOOK_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
      OPENAI_ORGANIZATION: ${OPENAI_ORGANIZATION:-}
      OPENAI_PROJECT: ${OPENAI_PROJECT:-}
      NANOBANANA_API_KEY: ${NANOBANANA_API_KEY}
      NANOBANANA_BASE_URL: ${NANOBANANA_BASE_URL:-https://api.nanobananaapi.ai}
      NANOBANANA_CALLBACK_URL: ${NANOBANANA_CALLBACK_URL}
    ports:
      - "8000:8000"

  analytics-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: analytics-consumer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_AD_EVENTS_TOPIC: ${KAFKA_AD_EVENTS_TOPIC:-ad-events}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-analytics-consumer}
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-eshkere}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      - app
      - auth
      - profile
      - node-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PUBLIC_PORT:-8002}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PUBLIC_PORT:-8001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eshkere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eshkere}
      POSTGRES_DB: ${POSTGRES_DB:-eshkere}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.1
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-eshkere}:${POSTGRES_PASSWORD:-eshkere}@postgres:5432/${POSTGRES_DB:-eshkere}?sslmode=disable
      - up

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-eshkere}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config/listen-host.xml:/etc/clickhouse-server/config.d/listen-host.xml:ro
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/minio:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-eshkere}
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$S3_BUCKET &&
        mc anonymous set public local/$$S3_BUCKET
      "

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  kafka_data:
  clickhouse_data:
