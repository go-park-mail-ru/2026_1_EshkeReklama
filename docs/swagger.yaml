    type: object
  dto.StatsPoint:
    properties:
      clicks:
        type: integer
      cpc:
        type: number
      ctr:
        type: number
      date:
        type: string
      impressions:
        type: integer
      partner_reward:
        type: integer
      platform_revenue:
        type: integer
      spend:
