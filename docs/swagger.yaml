  dto.PartnerSiteResponse:
    properties:
      created_at:
        type: string
      domain:
        type: string
      id:
        type: integer
      site_name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  dto.RegisterResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      phone:
        type: string
    type: object
  dto.StatsEntityRow:
