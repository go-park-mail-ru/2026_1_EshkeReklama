      reason:
        type: string
    type: object
  dto.TopUpBalanceRequest:
    properties:
      amount:
        type: integer
    type: object
  dto.UpdateAdCampaignRequest:
    properties:
      cpm_price:
        minimum: 0
        type: integer
      daily_budget:
        minimum: 0
        type: integer
      main_action:
        minLength: 1
        type: string
      name:
        minLength: 1
        type: string
    type: object
  dto.UpdateAdCampaignStatusRequest:
    properties:
      status:
        enum:
        - turned_off
        type: string
    required:
    - status
    type: object
  dto.UpdateAdGroupRequest:
    properties:
      age_from:
        minimum: 1
        type: integer
      age_to:
        minimum: 1
        type: integer
      gender:
        enum:
        - male
        - female
        - any
        minLength: 1
        type: string
      name:
        minLength: 1
        type: string
      region_id:
        minimum: 1
        type: integer
      topic_id:
        minimum: 1
        type: integer
    type: object
  dto.UpdateAdStatusRequest:
    properties:
      status:
        enum:
        - approve
        - disapprove
        type: string
    required:
    - status
    type: object
  dto.UpdateAdvertiserProfileRequest:
    properties:
      city:
        type: string
      company:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      surname:
        type: string
      tariff:
        type: string
    type: object
  dto.UpdatePartnerBlockGeneralRequest:
    properties:
      amp_mode:
        enum:
        - disabled
        - enabled
        type: string
      border_mode:
        enum:
        - auto
        - enabled
        - disabled
        type: string
      corner_mode:
        enum:
        - auto
        - rounded
        - square
        type: string
      cpm_strategy:
        enum:
        - max_income
        type: string
      interscroller_background_color:
        type: string
      interscroller_mode:
        enum:
        - auto
        - enabled
        - disabled
        type: string
      revenue_share_bps:
        maximum: 10000
        minimum: 0
        type: integer
      size_mode:
        enum:
        - adaptive
        type: string
      theme:
        enum:
        - light
        - dark
        type: string
    type: object
  dto.UpdatePartnerBlockGeographyRequest:
    properties:
      global_cpmv:
        type: integer
      only_configured:
        type: boolean
      rules:
        items:
          $ref: '#/definitions/dto.UpdatePartnerBlockGeographyRuleRequest'
        type: array
    type: object
  dto.UpdatePartnerBlockGeographyRuleRequest:
    properties:
      cpmv:
        type: integer
      geo_code:
        type: string
      is_enabled:
        type: boolean
    required:
    - geo_code
    type: object
  dto.UpdatePartnerBlockMetaRequest:
    properties:
      name:
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
    type: object
  dto.UpdatePartnerBlockSelfAdRequest:
    properties:
      reserved:
        type: boolean
    type: object
  dto.UpdatePartnerProfileRequest:
    properties:
      birth_date:
        type: string
      cooperation_form:
        enum:
        - self_employed
        - individual_entrepreneur
        - legal_entity
        type: string
      country_code:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      middle_name:
        type: string
      payout_currency:
        enum:
        - RUB
        - USD
        - EUR
        type: string
      phone:
        type: string
      registration_region_code:
        type: string
    type: object
  dto.UpdatePartnerSiteRequest:
    properties:
      domain:
        type: string
      site_name:
        type: string
      status:
        type: string
    type: object
  dto.VKIDLoginRequest:
    properties:
      access_token:
        type: string
      user_id:
        type: integer
    type: object
  httpx.Error:
    properties:
      error:
        type: string
    type: object
  httpx.Success:
    properties:
      data: {}
    type: object
host: localhost:8000
info:
  contact: {}
  description: API для управления рекламодателями и их рекламными кампаниями.
  title: Eshke Reklama API
  version: "1.0"
paths:
  /ad/request:
    post:
      consumes:
      - application/json
      description: Возвращает объявление для вставленного на сайт партнёра рекламного
        блока по embed_token
      parameters:
      - description: Публичный токен рекламного блока
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdRequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.Error'
      summary: Запрос рекламы для публичного блока
      tags:
      - public_ads
  /ad_campaigns:
    get:
      description: Кампании рекламодателя из сессии
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListAdCampaignsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - CookieAuth: []
      summary: Список рекламных кампаний
      tags:
      - ad_campaigns
    post:
      consumes:
      - application/json
      description: Создаёт кампанию; рекламодатель определяется по сессии
      parameters:
      - description: Параметры кампании
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAdCampaignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CreateAdCampaignResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - CookieAuth: []
      summary: Создание рекламной кампании
      tags:
      - ad_campaigns
  /ad_campaigns/{ad_campaign_id}:
    delete:
      parameters:
      - description: ID кампании
        in: path
        name: ad_campaign_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.Success'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - CookieAuth: []
      summary: Удаление рекламной кампании
      tags:
      - ad_campaigns
    put:
      consumes:
      - application/json
      description: Частичное обновление полей кампании
      parameters:
      - description: ID кампании
        in: path
        name: ad_campaign_id
        required: true
        type: integer
      - description: Поля для обновления
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAdCampaignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.Success'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - CookieAuth: []
      summary: Обновление рекламной кампании
      tags:
      - ad_campaigns
  /ad_campaigns/{ad_campaign_id}/ad_groups:
    get:
      parameters:
      - description: ID рекламной кампании
        in: path
        name: ad_campaign_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListAdGroupsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
        "500":
          description: Internal Server Error
