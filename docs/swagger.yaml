  dto.StatsMetric:
    properties:
      clicks:
        type: integer
      cpc:
        type: number
      ctr:
        type: number
      impressions:
        type: integer
      partner_reward:
        type: integer
      platform_revenue:
        type: integer
      spend:
        type: integer
    type: object
  dto.StatsPeriod:
    properties:
      from:
        type: string
      to:
