global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: app
    static_configs:
      - targets:
          - app:9100

  - job_name: auth
    static_configs:
      - targets:
          - auth:9101

  - job_name: profile
    static_configs:
      - targets:
          - profile:9102

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
